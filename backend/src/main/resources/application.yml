server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/psy_db}
    username: ${SPRING_DATASOURCE_USERNAME:psy_user}
    password: ${SPRING_DATASOURCE_PASSWORD:psy_pass}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

app:
  jwt:
    secret: ${APP_JWT_SECRET:change-me-super-long-secret-key-for-hs256}
    expiration-ms: ${APP_JWT_EXPIRATION_MS:86400000}
  ollama:
    base-url: ${APP_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${APP_OLLAMA_MODEL:qwen2.5:7b}
